version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: flood-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: flood-monitoring
    volumes:
      - mongo-data:/data/db
    networks:
      - flood-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flood-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/flood-monitoring
      JWT_SECRET: your_jwt_secret_key
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - flood-network
    command: npm run dev

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flood-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_API_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - flood-network
    command: npm run dev

  # MQTT Broker (Optional)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: flood-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - flood-network
    depends_on:
      - backend

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: flood-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - flood-network
    command: redis-server --appendonly yes

networks:
  flood-network:
    driver: bridge

volumes:
  mongo-data:
  mosquitto-data:
  mosquitto-logs:
  redis-data:
